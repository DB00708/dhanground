# Split by RBI document (never by row), sized by passages, so dev and test cover the topics customers ask about.
# Row targets: train 3,000, dev 300, test 500 (100 unanswerable, 100 adversarial).
seed: 0
passage_ratios:
  train: 0.76
  dev: 0.08
  test: 0.16
core_topics: [upi, atm, cards, kyc, ombudsman, fraud]
